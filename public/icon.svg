<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B3A4F0"/>
      <stop offset="1" stop-color="#7FB6E6"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3d2f6b" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- steam -->
  <g stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M205 205 C 188 182, 222 168, 205 143"/>
    <path d="M256 200 C 239 175, 273 160, 256 132"/>
    <path d="M307 205 C 290 182, 324 168, 307 143"/>
  </g>

  <!-- pot -->
  <g filter="url(#soft)">
    <rect x="120" y="286" width="34" height="26" rx="13" fill="#FFFFFF"/>
    <rect x="358" y="286" width="34" height="26" rx="13" fill="#FFFFFF"/>
    <rect x="150" y="262" width="212" height="140" rx="36" fill="#FFFFFF"/>
    <rect x="134" y="242" width="244" height="34" rx="17" fill="#FFFFFF"/>
    <circle cx="256" cy="234" r="13" fill="#FFFFFF"/>
    <rect x="150" y="330" width="212" height="72" rx="30" fill="#EFE9FC"/>
  </g>

  <!-- little sparkle -->
  <path d="M372 150 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z" fill="#FFFFFF" opacity="0.95"/>
</svg>
